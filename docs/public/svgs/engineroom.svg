    <rect id="ri-sw-p" class="readout" x="346" y="537" width="108" height="38" rx="7" />
    <rect id="ri-dp" class="readout" x="516" y="819" width="108" height="38" rx="7" />
    <rect id="ri-sw-f" class="readout" x="806" y="671" width="108" height="38" rx="7" />
    <rect id="ri-fw-p" class="readout" x="246" y="251" width="108" height="38" rx="7" />
    <rect id="ri-t-in" class="readout" x="826" y="281" width="108" height="38" rx="7" />
    <rect id="ri-t-out" class="readout" x="646" y="131" width="108" height="38" rx="7" />
    <rect id="ri-mix" class="readout" x="1126" y="451" width="108" height="38" rx="7" />
    <rect id="ri-load" class="readout" x="1226" y="371" width="108" height="38" rx="7" />
  </g>
</svg>
