  <g id="core">
    <rect class="core" x="700" y="333" width="200" height="234" />
    <g class="core-cell" data-kind="lifts"><rect x="712" y="345" width="80" height="66" rx="4" /><g class="core-icon" transform="translate(741 367) scale(0.9167000000000001)"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2M8.5 6a1.25 1.25 0 1 1 0 2.5a1.25 1.25 0 0 1 0-2.5m2.5 8h-1v4H7v-4H6v-2.5c0-1.1.9-2 2-2h1c1.1 0 2 .9 2 2zm4.5 3L13 13h5zM13 11l2.5-4l2.5 4z"/></g></g>
