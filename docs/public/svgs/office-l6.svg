    <path id="r-612" d="M297.4 645 H457 V820 H297.4 Z" />
    <path id="r-613" d="M457 645 H616.5 V820 H457 Z" />
    <path id="r-614" d="M616.5 645 H776.1 V820 H616.5 Z" />
    <path id="r-615" d="M776.1 645 H967.5 V820 H776.1 Z" />
