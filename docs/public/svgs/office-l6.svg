    <g class="core-cell" data-kind="restrooms"><rect x="712" y="423" width="86" height="66" rx="4" /><g class="core-icon" transform="translate(744 445) scale(0.9167000000000001)"><path fill="currentColor" d="M7.5 2a2 2 0 0 1 2 2a2 2 0 0 1-2 2a2 2 0 0 1-2-2a2 2 0 0 1 2-2M6 7h3a2 2 0 0 1 2 2v5.5H9.5V22h-4v-7.5H4V9a2 2 0 0 1 2-2m10.5-5a2 2 0 0 1 2 2a2 2 0 0 1-2 2a2 2 0 0 1-2-2a2 2 0 0 1 2-2M15 22v-6h-3l2.59-7.59C14.84 7.59 15.6 7 16.5 7s1.66.59 1.91 1.41L21 16h-3v6z"/></g></g>
    <g class="core-cell" data-kind="tea point"><rect x="802" y="423" width="86" height="66" rx="4" /><g class="core-icon" transform="translate(834 445) scale(0.9167000000000001)"><path fill="currentColor" d="M2 21v-2h18v2zM20 8V5h-2v3zm0-5a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V3zm-4 2H6v8a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2z"/></g></g>
