    <g id="core-lift-b" class="core" data-kind="lift" transform="translate(1345 336)">
      <rect x="-25" y="-25" width="50" height="50" rx="4" />
      <g class="core-icon" transform="translate(-15 -15) scale(1.25)"><path fill="currentColor" d="m7 2l4 4H8v4H6V6H3zm10 8l-4-4h3V2h2v4h3zM7 12h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2m0 2v6h10v-6z"/></g>
    </g>
    <g id="core-stair-a" class="core" data-kind="stair" transform="translate(297 574)">
      <rect x="-28" y="-24" width="56" height="48" rx="4" />
      <g class="core-icon" transform="translate(-14 -14) scale(1.1667)"><path fill="currentColor" d="M15 5v4h-4v4H7v4H3v3h7v-4h4v-4h4V8h4V5z"/></g>
    </g>
    <g id="core-stair-b" class="core" data-kind="stair" transform="translate(1345 574)">
      <rect x="-28" y="-24" width="56" height="48" rx="4" />
      <g class="core-icon" transform="translate(-14 -14) scale(1.1667)"><path fill="currentColor" d="M15 5v4h-4v4H7v4H3v3h7v-4h4v-4h4V8h4V5z"/></g>
    </g>
  </g>

