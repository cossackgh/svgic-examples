<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Background layer -->
  <g id="background">
    <rect width="900" height="600" fill="#1a1a2e"/>
    <rect x="20" y="20" width="860" height="560" rx="4" fill="none" stroke="#2d2d52" stroke-width="2"/>
    <!-- Mall corridor -->
    <rect x="20" y="330" width="860" height="60" fill="#20203a"/>
    <text x="450" y="367" text-anchor="middle" fill="#4a4a70" font-size="12" font-family="sans-serif" letter-spacing="3">CORRIDOR</text>
  </g>

  <!-- Units layer (interactive). Every shape here is awkward on purpose. -->
  <g id="units">
    <!-- L-shape: the center of the bounding box falls outside the fill -->
    <path id="u-101" d="M40 40 H300 V180 H170 V310 H40 Z" fill="#2d2d52" stroke="#3d3d6b" stroke-width="2"/>

    <!-- U-shape: a wide top and two narrow legs -->
    <path id="u-102" d="M330 40 H560 V310 H495 V125 H395 V310 H330 Z" fill="#2d2d52" stroke="#3d3d6b" stroke-width="2"/>

    <!-- Narrow and tall: only a rotated label fits -->
    <rect id="u-103" x="590" y="40" width="46" height="270" fill="#2d2d52" stroke="#3d3d6b" stroke-width="2"/>

    <!-- Ring: the geometric center is a hole -->
    <path id="u-104" d="M670 40 H840 V310 H670 Z M712 112 H798 V238 H712 Z" fill-rule="evenodd" fill="#2d2d52" stroke="#3d3d6b" stroke-width="2"/>

    <!-- Tiny: nothing but the shortest candidate fits -->
    <rect id="u-105" x="40" y="410" width="74" height="74" fill="#2d2d52" stroke="#3d3d6b" stroke-width="2"/>

    <!-- Wide and roomy -->
    <rect id="u-106" x="144" y="410" width="416" height="150" fill="#2d2d52" stroke="#3d3d6b" stroke-width="2"/>

    <!-- Shapes wrapped in a group instead of laid flat in the layer -->
    <g id="u-107">
      <rect x="590" y="410" width="250" height="60" fill="#2d2d52" stroke="#3d3d6b" stroke-width="2"/>
      <rect x="590" y="470" width="120" height="90" fill="#2d2d52" stroke="#3d3d6b" stroke-width="2"/>
    </g>

    <!-- A half turn, the way editors write it: negative coordinates plus scale(-1) -->
    <rect id="u-108" x="-840" y="-560" width="110" height="90" transform="scale(-1)" fill="#2d2d52" stroke="#3d3d6b" stroke-width="2"/>
  </g>
</svg>
